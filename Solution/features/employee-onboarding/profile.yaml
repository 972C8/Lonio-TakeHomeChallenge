# Feature profile: everything specific to ONE feature (one process to specify) lives in this folder.
# The engine and adapters are shared across features.
id: employee-onboarding
title: Employee onboarding questionnaire
goal: >
  Define what Lonio asks a new employee during onboarding: which information,
  in which steps and order, and under which conditions - asking each piece of
  information once and reusing it for every receiving party. Must include a
  questionnaire flow overview.
output: feature_specs

sources:
  - id: hr_transcript
    type: transcript
    path: ../Instructions/Anhang/HR meeting transcript.pdf
    speakers: [Leo, Anna]
    description: >
      Fictional meeting between Leo (Lonio product, interviewer) and Anna (HR
      manager at the customer Muster AG, the stakeholder).
    authority: Policy and scope - who must answer what, business rules, what is in or out.
    precedence: 2
  - id: pension_portal
    type: screenshots
    path: ../Instructions/Anhang/Pension portal screenshots
    description: >
      Screenshots 01-07 of the employer portal of the pension fund
      "Pensionskasse Muster" (fictional), page "Register new employee".
    authority: Pension fund data - fields, formats, options and required flags it accepts.
    precedence: 1
  - id: zh_source_tax_calculator
    type: web_calculator
    url: https://www.zh.ch/de/steuern-finanzen/steuern/quellensteuer/quellensteuer-tarife.html
    description: Canton of Zurich source tax tariff calculator (real).
    authority: Source tax data - which questions determine the tariff code, options, conditions.
    precedence: 1
    explore_hints: >
      The calculator is embedded directly on the page (section "Tarifrechner
      Quellensteuer") and reveals one question at a time. Pay special attention
      to: residence in Switzerland vs abroad (and per country), civil status,
      spouse working, children, church tax, permit type, cross-border cases.

# Stakeholders: who needs information ("Who needs it?") and who can be the
# actor of a user story.
stakeholders:
  employee: new employee - provides the information
  hr: HR - the customer company's HR (Muster AG), runs onboarding and registrations
  pension_fund: pension fund - Pensionskasse Muster, registers the employee for occupational pension (BVG)
  source_tax: source tax office - source tax tariff determination (Canton of Zurich calculator)

# The questions every information item must answer (enforced by the linter).
# This is the assignment's checklist; another feature can declare its own.
item_checklist:
  - {question: "What? What exactly do we need, and in what form?", attribute: description}
  - {question: "When do we ask? Always, or only under which conditions?", attribute: asked_when}
  - {question: "When is it required? When can it be left empty?", attribute: required_when}
  - {question: "What does it depend on?", attribute: asked_when_expr}
  - {question: "Who needs it? Which source asks for it?", attribute: needed_by}

# Optional: a flow overview (the steps the user goes through, in order) at the top of feature.md.
flow:
  title: Questionnaire flow

# Optional: hints for how to group the stories into sections (free text for the planner).
section_hints: ""

# Implementation vocabulary to flag in addition to the engine's default list,
# and words that are legitimate business terms in this domain.
tech_vocabulary:
  flag: []
  allow: []

# Decisions by the product owner have the highest precedence (0).
decisions_file: decisions.yaml

models:
  default: claude-opus-5-5
  extract: claude-opus-5-5
  vision: claude-opus-5-5
  synthesize: claude-opus-5-5
  judge: claude-sonnet-5-5
  builder: claude-opus-5-5
  review: claude-opus-5-5
  explore: claude-opus-5-5
