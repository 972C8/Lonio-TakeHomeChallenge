- id: D-033
  action: direct
  target: ''
  statement: The employee enters the first working day. After submission only HR can change it; the latest
    date always counts and no history of earlier dates is kept.
  value: null
  rationale: Product choice for ownership of the first working day; HR handles later changes.
  by: Product owner
  evidence:
  - hr_transcript/T-026
  - hr_transcript/T-028
  evidence_hash: 45d20ce1e4b1
- id: D-034
  action: direct
  target: ''
  statement: Only the employee side is in scope. Who starts the onboarding and any HR screen are specified
    later; the spec says answers are recorded for HR, not 'available to HR'. HR-side needs from D-007
    (flag) and D-033 (HR changes the date) are noted for that later spec.
  value: null
  rationale: Keep this feature spec to the questionnaire; the HR side is a separate topic.
  by: Product owner
  evidence:
  - hr_transcript/T-004
  evidence_hash: f5a457e80870
- id: D-035
  action: direct
  target: ''
  statement: For the cross-border questions the employee states what they expect for the year (non-return
    days). For the certificate of residence 'not yet' is a valid answer and counts as 'no' for the tariff
    code. Documents go to HR outside Lonio; no upload.
  value: null
  rationale: The calculator asks for a declaration, not proof; a new hire often has no certificate yet.
  by: Product owner
  evidence:
  - zh_source_tax_calculator/C-Q19
  evidence_hash: d5d0cd8552c3
- id: D-036
  action: direct
  target: ''
  statement: Answers to questions that no longer apply after the employee changes an earlier answer are
    discarded on submission; until then they may be kept so going back and forth loses no input.
  value: null
  rationale: Data minimisation (G-01) - keep no personal data that no party needs.
  by: Product owner
  evidence: []
  evidence_hash: e3b0c44298fc
- id: D-037
  action: direct
  target: ''
  statement: After submission the questionnaire is read-only for the employee. Any later change (a move,
    a marriage, a new child, a certificate of residence handed in later, a corrected nationality) is made
    by HR and belongs to the later HR-side spec (D-034). Every derived result (insurance start date, civil
    status for the fund and for source tax, subject to source tax, tariff code) is always derived again
    from the latest answers, as for the first working day (D-033).
  value: null
  rationale: Closes the review's questions on post-submission edits and the late certificate of residence
    without designing the HR side now.
  by: Product owner
  evidence:
  - hr_transcript/T-024
  evidence_hash: f3c59492f1c3
- id: D-038
  action: direct
  target: ''
  statement: Employees living abroad get the permit reminder whatever their nationality, because nationality
    is not asked of them (data minimisation, G-01). HR words the reminder so that a Swiss citizen living
    abroad, such as Stefan, can see that it does not apply to them. Asking everyone 'Swiss citizen yes/no'
    only for the reminder is not worth the extra question.
  value: null
  rationale: A generic reminder costs nothing; an extra question collects data no party needs.
  by: Product owner
  evidence:
  - hr_transcript/T-042
  - hr_transcript/T-048
  evidence_hash: 742d1eb0415c
- id: D-039
  action: direct
  target: ''
  statement: The first working day is the contractual start date, even when it falls on a weekend or public
    holiday. The insurance start date is derived from this date only. Assumption - to be verified by a
    domain expert; state this assumption in the user story.
  value: null
  rationale: 'Review finding: insurance start was tied sometimes to the contract and sometimes to the
    first working day.'
  by: Product owner
  evidence: []
  evidence_hash: e3b0c44298fc
- id: D-040
  action: direct
  target: ''
  statement: For employees living in Liechtenstein, the questions on daily return and on more than 45
    days abroad come before denomination, spouse and children. When the answers mean 'in principle no
    source tax liability', the tariff questions are skipped. When the employee stays abroad more than
    45 days, the normal tariff is recorded with the note 'subject to the double taxation agreement' and
    flagged for HR. Assumption - to be verified by a domain expert; state this assumption in the user
    story.
  value: null
  rationale: 'Review finding: question order and the DTA reservation were unclear (B4 HR follow-up).'
  by: Product owner
  evidence: []
  evidence_hash: e3b0c44298fc
- id: D-041
  action: direct
  target: ''
  statement: The residence country and address asked are those that apply on the first working day. Assumption
    - to be verified by a domain expert; state this assumption in the user story.
  value: null
  rationale: 'Review finding: timing of residence country was not stated.'
  by: Product owner
  evidence: []
  evidence_hash: e3b0c44298fc
- id: D-042
  action: direct
  target: ''
  statement: The house number is required, as HR wants the address complete including the house number;
    an explicit 'no house number' option covers addresses without one. Assumption - to be verified by
    a domain expert; state this assumption in the user story.
  value: null
  rationale: 'Review finding: house number required without a cited source; HR transcript states a complete
