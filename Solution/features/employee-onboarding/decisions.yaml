# Product decisions: the human override layer.
#
# Applied deterministically AFTER the agents ran (they cannot reinterpret
# them), cited in the feature specs like any source, with the highest precedence.
#
# action:  direct    statement: <instruction>  (no target; steers the agents BEFORE they write:
#                    a product or scope choice that needs new content derived from the sources.
#                    The agents must follow and cite it; reruns modelling, so it costs more.)
#          override  target: item.<id>.<attr> | rule.<id>.<attr> | story.<id>.<attr> | section.<id>.<attr> | feature.<attr>
#          add       target: item.<id> | rule.<id> | story.<id> (value.section = section id) | section.<id>; value = full object
#          exclude   target: item.<id> | rule.<id> | story.<id>   (moves it to out of scope)
#          resolve   target: open.<id>                             (closes an open question)
#          accept    target: fact.<id>   (confirms an inferred fact)
#          reject    target: fact.<id>   (removes a fact before modelling)
#
# evidence: unit ids (hr_transcript/T-012, pension_portal/S05-E14 ...) the decision is based on or overrides.
# evidence_hash is filled in by the pipeline; if the evidence text changes later,
# the decision is flagged "needs re-confirmation" in review.md.
#
# Use the /decide skill to write entries from plain language.
decisions:
- id: D-001
  action: direct
  target: ''
  statement: Lonio computes the full Zurich source tax tariff code (tariff letter including the cross-border
    letters, child digit and church-tax suffix, e.g. "C1Y", "L0Y") for every employee subject to source
    tax, from the answers it collects, following the calculator's logic. HR no longer clicks through the
    calculator.
  value: null
  rationale: Product choice to replace HR's manual calculator step with a computed tariff code.
  by: Product owner
  evidence:
  - hr_transcript/T-012
  evidence_hash: a39533607e93
- id: D-002
  action: direct
  target: ''
  statement: Ask for the canton (pension fund 'Canton' field) from every employee. Employees living in
    Switzerland choose their canton of residence; for employees living abroad the canton of the place
    of work is entered (Zurich for Muster AG) and not asked. This closes OQ-canton-abroad. Assumption
    - to be verified by a domain expert; state this assumption in the user story.
  value: null
  rationale: Employees abroad have no valid canton to choose; asking only residents unblocks the spec
    until the fund answers.
  by: Product owner
  evidence:
  - pension_portal/S01-E10
  - pension_portal/S02-E37
  - hr_transcript/T-048
  evidence_hash: cbfef0b04f72
- id: D-003
  action: direct
  target: ''
  statement: Civil status offers Single, Married, Divorced, Widowed, Registered partnership and Separated.
    For source tax, registered partnership counts as married (including the spouse exemption) and separated
    counts as single, as in the calculator. For the pension fund, registered partnership is entered as
    Married with the partner's date of birth, and separated as Married. This closes OQ-civil-status-partnership.
    Assumption - to be verified by a domain expert; state this assumption in the user story.
  value: null
  rationale: The calculator settles the source tax side; a provisional fund mapping unblocks the spec.
  by: Product owner
  evidence:
  - hr_transcript/T-034
  - hr_transcript/T-036
  - zh_source_tax_calculator/C-Q02
  evidence_hash: ad7023524c57
- id: D-004
  action: direct
  target: ''
  statement: The spouse's (or registered partner's) date of birth is asked from married employees, registered
    partners and separated employees (all entered at the fund as Married, see D-003), not from divorced
    or widowed employees; no spouse data is sent to the fund for them. This closes OQ-spouse-dob-other-status
    and OQ-separated-spouse-dob. Assumption - to be verified by a domain expert; state this assumption
    in the user story.
  value: null
  rationale: HR states it for married employees; separated employees go to the fund as Married, which
    requires it.
  by: Product owner
  evidence:
  - hr_transcript/T-032
  - pension_portal/S03-E23
  - pension_portal/S03-E24
  evidence_hash: 345a88d27a73
- id: D-005
  action: direct
  target: ''
  statement: Do not ask for the permit type. Ask non-Swiss employees only whether they hold a C permit
    (permanent residence), yes or no, and the same for a non-Swiss spouse. No party needs any other permit
    type. This closes OQ-permit-list. To be verified by a domain expert.
  value: null
  rationale: Only 'C permit or not' drives a rule (G-01, data minimisation).
  by: Product owner
  evidence:
  - hr_transcript/T-038
  - hr_transcript/T-044
  evidence_hash: bb7a5a2bde47
- id: D-006
  action: direct
  target: ''
  statement: A new employee always has earned income. Do not ask the income type, and drop the replacement-income
    questions and the tariff G / Q cases. This closes OQ-income-type. To be verified by a domain expert.
  value: null
  rationale: Onboarding is about starting a paid job; replacement income does not occur.
  by: Product owner
  evidence:
  - zh_source_tax_calculator/C-Q01
  evidence_hash: 251d23500ad3
- id: D-007
  action: direct
  target: ''
  statement: Liechtenstein residents are asked the source tax questions (HR's rule decides who is asked).
    The result follows the calculator - with daily return or at most 45 non-return days, Lonio shows 'in
    principle no source tax liability, subject to the double taxation agreement' instead of a tariff code,
    flagged for HR; with more than 45 non-return days, the normal tariff code. This closes OQ-liechtenstein-conflict.
    To be verified by a domain expert.
  value: null
  rationale: The calculator reflects the tax treaty; asking anyway keeps the data if the expert decides
    otherwise.
  by: Product owner
  evidence:
  - hr_transcript/T-049
  - hr_transcript/T-050
  - zh_source_tax_calculator/C-Q22
  - zh_source_tax_calculator/C-Q23
  evidence_hash: b8159525af03
- id: D-008
  action: direct
  target: ''
  statement: Anyone with Swiss citizenship counts as Swiss for source tax, even with another nationality.
    This closes OQ-dual-nationality. To be verified by a domain expert.
  value: null
  rationale: HR's own wording makes holding a Swiss passport the criterion.
  by: Product owner
  evidence:
  - hr_transcript/T-010
  evidence_hash: 4646a5804a86
- id: D-009
  action: direct
  target: ''
  statement: Before go-live a domain expert compares Lonio's computed tariff code with the calculator
    for the paths not explored (residence block for A/B/H, more than 3 children, H3N/P3N). Special tariffs
    such as D (second job) are out of scope for onboarding. Keep OQ-calculator-coverage open as a non-blocking
    go-live condition.
  value: null
  rationale: Lonio now owns the tariff result, so unexplored calculator paths must be checked before release.
  by: Product owner
  evidence: []
  evidence_hash: e3b0c44298fc
