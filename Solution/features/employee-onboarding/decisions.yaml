- id: D-046
  action: direct
  target: ''
  statement: For the per-child source tax result, observed calculator table rows win over the derived
    expression. Inferred rows stay under the D-009 go-live check. Assumption - to be verified by a domain
    expert; state this assumption in the user story.
  value: null
  rationale: 'Review finding: per-child result inferred and inconsistent with observed rows.'
  by: Product owner
  evidence: []
  evidence_hash: e3b0c44298fc
- id: D-047
  action: direct
  target: ''
  statement: The questionnaire has exactly these steps, in this order, and feature.md, the flow rule and
    the stories use the same list. 1 About you (first name, last name, date of birth, first working day);
    2 Home address (as on the first working day, canton only in Switzerland); 3 Nationality and C permit
    (only employees living in Switzerland); 4 Civil status and spouse (civil status is asked of everyone,
    wherever they live); 5 Cross-border commuting (Liechtenstein and Germany residents subject to source
    tax); 6 Source tax details (denomination, spouse gainfully employed, has children); 7 Children (one
    block per child); 8 Permit reminder, summary and submission. There is no separate step for the first
    working day. Assumption - to be verified by a domain expert; state this assumption in the user story.
  value: null
  rationale: 'Review finding: feature.md had 8 steps, the flow rule and US-01.2 had 10.'
  by: Product owner
  evidence: []
  evidence_hash: e3b0c44298fc
- id: D-048
  action: direct
  target: ''
  statement: When HR changes an answer after submission so that questions apply that were never asked,
    the derived results that depend on them (for example the tariff code) show 'incomplete - HR must complete'
    instead of a value, until HR enters the missing answers. Answers that no longer apply after an HR
    change are discarded, as on the employee's submission. Assumption - to be verified by a domain expert;
    state this assumption in the user story.
  value: null
  rationale: 'Review finding: behaviour after an HR edit was undefined (US-01.6).'
  by: Product owner
  evidence: []
  evidence_hash: e3b0c44298fc
- id: D-049
  action: direct
  target: ''
  statement: Every home address field (street, house number, postcode, town, country) is required; the
    only exception is the explicit 'no house number' option. Examples and acceptance criteria use the
    term 'required' for these fields, never 'asked'. Assumption - to be verified by a domain expert; state
    this assumption in the user story.
  value: null
  rationale: 'Review finding: address criteria and examples disagreed on required fields.'
  by: Product owner
  evidence: []
  evidence_hash: e3b0c44298fc
- id: D-050
  action: direct
  target: ''
  statement: Build-time values. HR provides the permit reminder wording before go-live. Country of residence
    and nationality are chosen from the ISO 3166 country list; nationality also offers 'stateless'. The
    date of birth must make the employee at least 14 and at most 100 years old on the first working day;
