- id: D-045
  action: direct
  target: ''
  statement: Business text (stories, acceptance criteria, notices) uses no internal snake_case ids and
    does not speak of 'expressions'. Any behaviour that has no cited fact or decision is stated in the
    story as an assumption. Assumption - to be verified by a domain expert; state this assumption in the
