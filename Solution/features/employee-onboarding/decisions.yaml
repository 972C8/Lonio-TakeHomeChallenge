# Product decisions: the human override layer.
#
# Applied deterministically AFTER the agents ran (they cannot reinterpret
# them), cited in the feature specs like any source, with the highest precedence.
#
# action:  override  target: item.<id>.<attr> | rule.<id>.<attr> | story.<id>.<attr> | section.<id>.<attr> | feature.<attr>
#          add       target: item.<id> | rule.<id> | story.<id> (value.section = section id) | section.<id>; value = full object
#          exclude   target: item.<id> | rule.<id> | story.<id>   (moves it to out of scope)
#          resolve   target: open.<id>                             (closes an open question)
#          accept    target: fact.<id>   (confirms an inferred fact)
#          reject    target: fact.<id>   (removes a fact before modelling)
#
# evidence: unit ids (T-012, S05-E14 ...) the decision is based on or overrides.
# evidence_hash is filled in by the pipeline; if the evidence text changes later,
# the decision is flagged "needs re-confirmation" in review.md.
#
# Use the /decide skill to write entries from plain language.
decisions: []
