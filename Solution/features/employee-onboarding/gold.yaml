# Hand-labelled gold set (written by a human from the sources, NOT by the pipeline).
# Used by `eval` to report recall/precision of the generated spec.
# Calculator-derived items will be added once the calculator is explored.

items:
  - {id: first_name, needed_by: [pension_fund]}
  - {id: last_name, needed_by: [pension_fund]}
  - {id: date_of_birth, needed_by: [pension_fund]}
  - {id: nationality, needed_by: [source_tax]}
  - {id: permit_type, needed_by: [source_tax]}
  - {id: address_street, aliases: [street], needed_by: [hr]}
  - {id: address_house_number, aliases: [house_number, street_number], needed_by: [hr]}
  - {id: address_postcode, aliases: [postcode, postal_code, zip], needed_by: [hr]}
  - {id: address_town, aliases: [town, city], needed_by: [hr]}
  - {id: address_country, aliases: [country, residence_country], needed_by: [hr, source_tax]}
  - {id: residence_canton, aliases: [canton], needed_by: [pension_fund]}
  - {id: first_working_day, aliases: [start_date], needed_by: [pension_fund]}
  - {id: civil_status, aliases: [marital_status], needed_by: [pension_fund, source_tax]}
  - {id: spouse_date_of_birth, needed_by: [pension_fund]}
  - {id: spouse_nationality, needed_by: [source_tax]}
  - {id: spouse_permit_type, needed_by: [source_tax]}
  - {id: spouse_residence_country, aliases: [spouse_lives_in_switzerland], needed_by: [source_tax]}

rules:
  - subject_to_source_tax
  - insurance_start_date

exclusions:          # keywords that must appear in an exclusion
  - photo
  - laptop

stories:             # keywords that must appear in some user story
  - permit
  - source tax

open_questions:      # keywords that must appear in an open question
  - registered partnership
  - canton
