# Named examples from the sources (written by a human, never by the pipeline).
# Executed against the knowledge model on every run, in addition to the
# examples the story writer puts into the acceptance criteria.
#   given:  information item id -> value (in the business wording of the allowed values)
#   expect: item id -> asked | not asked | required | optional ; rule id -> expected outcome
examples:
- id: maria
  from: 'T: Maria in sales, Portuguese, C permit, no source tax'
  given:
    nationality: Portugal
    permit_type: C permit
    address_country: Switzerland
    civil_status: Single
    first_working_day: 01.06.2026
  expect:
    subject_to_source_tax: 'no'
- id: tomas
  from: 'T: Tomás, Brazilian, B permit, wife Swiss, live in Winterthur -> no source tax'
  given:
    nationality: Brazil
    permit_type: B permit
    address_country: Switzerland
    civil_status: Married
    spouse_nationality: Switzerland
    spouse_residence_country: Switzerland
    first_working_day: 01.06.2026
  expect:
    subject_to_source_tax: 'no'
    spouse_nationality: asked
    spouse_date_of_birth: asked
- id: stefan
  from: 'T: Stefan, Swiss, lives in Konstanz -> source tax regardless of passport'
  given:
    nationality: Switzerland
    address_country: Germany
    civil_status: Single
    first_working_day: 01.06.2026
  expect:
    subject_to_source_tax: 'yes'
- id: liechtenstein_resident
  from: 'T: woman in the warehouse who lives in Liechtenstein -> source tax'
  given:
    nationality: Liechtenstein
    address_country: Liechtenstein
    civil_status: Single
    first_working_day: 01.06.2026
  expect:
    subject_to_source_tax: 'yes'
- id: swiss_resident
  from: 'T: if you have a Swiss passport (and live here) you do not do source tax'
  given:
    nationality: Switzerland
    address_country: Switzerland
    civil_status: Married
    first_working_day: 01.06.2026
  expect:
    subject_to_source_tax: 'no'
    spouse_date_of_birth: asked
    permit_type: not asked
    spouse_nationality: not asked
    spouse_permit_type: not asked
- id: b_permit_single
  from: 'T: all non-Swiss without C permit do source tax'
  given:
    nationality: Germany
    permit_type: B permit
    address_country: Switzerland
    civil_status: Single
    first_working_day: 01.06.2026
  expect:
    subject_to_source_tax: 'yes'
    spouse_date_of_birth: not asked
    spouse_nationality: not asked
- id: b_permit_spouse_b_permit
  from: 'T: spouse exemption only for Swiss or C-permit spouses living here'
  given:
    nationality: Italy
    permit_type: B permit
    address_country: Switzerland
    civil_status: Married
    spouse_nationality: Italy
    spouse_permit_type: B permit
    spouse_residence_country: Switzerland
    first_working_day: 01.06.2026
  expect:
    subject_to_source_tax: 'yes'
- id: b_permit_spouse_c_permit
  from: 'T: married to someone with a C permit who lives here -> no source tax'
  given:
    nationality: Italy
    permit_type: B permit
    address_country: Switzerland
    civil_status: Married
    spouse_nationality: France
    spouse_permit_type: C permit
    spouse_residence_country: Switzerland
    first_working_day: 01.06.2026
  expect:
    subject_to_source_tax: 'no'
- id: b_permit_swiss_spouse_abroad
  from: 'T: spouse exemption requires that the spouse lives here'
  given:
    nationality: Italy
    permit_type: B permit
    address_country: Italy
    civil_status: Married
    spouse_nationality: Switzerland
    spouse_residence_country: Italy
    first_working_day: 01.06.2026
  expect:
    subject_to_source_tax: 'yes'
- id: julia
  from: 'T: Julia moved her first working day to 15 March -> insurance starts 1 April'
  given:
    nationality: Switzerland
    address_country: Switzerland
    civil_status: Single
    first_working_day: 15.03.2026
  expect:
    insurance_start_date: 01.04.2026
- id: starts_on_first
  from: 'T: unless somebody starts exactly on the first, then it''s just that day'
  given:
    nationality: Switzerland
    address_country: Switzerland
    civil_status: Single
    first_working_day: 01.05.2026
  expect:
    insurance_start_date: 01.05.2026
- id: marco_married
  from: 'S: married -> Spouse''s date of birth appears and is required (screens 05, 07)'
  given:
    nationality: Switzerland
    address_country: Switzerland
    civil_status: Married
    first_working_day: 01.06.2026
  expect:
    spouse_date_of_birth: required
- id: lena_single
  from: 'S: single -> no spouse field (screen 04)'
  given:
    nationality: Switzerland
    address_country: Switzerland
    civil_status: Single
    first_working_day: 01.06.2026
  expect:
    spouse_date_of_birth: not asked
